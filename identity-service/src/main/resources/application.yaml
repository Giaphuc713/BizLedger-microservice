server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

spring:
  config:
    import:
      - optional:configserver:http://localhost:8888
      - optional:file:./.env[.properties]
  application:
    name: identity-service
  flyway:
    baseline-on-migrate: true
    enabled: true
    locations: classpath:migration
  cloud:
    config:
      fail-fast: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
    default-encoding: UTF-8

bizledger:
  jwt:
    secret: c3VwZXItc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmctZm9yLXNlY3VyaXR5
    expiration: 86400000
    refresh-token-expiration-days: 7
#debug: true

swagger:
  title: "Identity Service"
  version: "1.0"
  description: "Identity Endpoints"
  package: identityservice
  gateway-url: http://localhost:8080

logging:
  level:
    com.overcode250204.common.web.GlobalExceptionHandler: INFO
